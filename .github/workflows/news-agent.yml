name: News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-agent.yml'
      - 'scripts/news-agent.mjs'
      - 'agent/sources.json'

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Refresh candidates on current main
        run: node scripts/retry-main-write.mjs news
        env:
          NEWS_LOOKBACK_DAYS: 4
          NEWS_MAX_PER_SOURCE: 15

      - name: Source health report
        if: always()
        run: node scripts/report-source-health.mjs

name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/news-agent.mjs
      - run: node --check scripts/prepare-editorial-input.mjs
      - run: node --check scripts/apply-editorial-response.mjs
      - run: node --check scripts/prepare-review-pr.mjs
      - run: node --check scripts/mark-review-state.mjs
      - run: npm test
      - name: Probe source feeds without publishing
        run: npm run agent:news
      - run: npm run build

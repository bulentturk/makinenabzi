name: Editorial Review State

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: editorial-review-state
  cancel-in-progress: false

jobs:
  record-result:
    if: startsWith(github.event.pull_request.head.ref, 'editorial-auto-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record review result on current main
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          ID=${PR_BRANCH#editorial-auto-}
          if [ "$PR_MERGED" = "true" ]; then STATE=published; else STATE=rejected; fi
          node scripts/retry-main-write.mjs review "$ID" "$STATE"

      - name: Start next editorial review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run editorial-review-pr.yml --ref main
